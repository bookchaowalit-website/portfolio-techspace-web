name: TechSpace CI

# BOO-235: full TechSpace checks (lint, typecheck, the vitest suite incl. the MCP tool/controller/client tests, build)
# on every push and pull request, now through the shared workflows.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      require-tests: true
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
